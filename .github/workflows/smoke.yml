# Smoke CI: import package + sanitizer-only A vs B on frozen splits.
name: smoke

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke-no-llm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install CPU deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 numpy==2.4.3 tqdm==4.67.1 scikit-learn==1.7.2 matplotlib==3.10.7 scipy==1.16.3
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==4.57.1 huggingface_hub==0.36.0 sentence-transformers==5.2.3
      - name: Score judge human validation (offline)
        run: python scripts/score_judge_human_validation.py
      - name: A vs B comparison (--no-llm, sanitizer-only)
        run: python -m src.run_experiments --compare-ab --no-llm
